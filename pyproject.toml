[project]
name = "faq-platform"
# バージョンは app/__init__.py の __version__ と同期させること
# Semantic Versioning (https://semver.org/lang/ja/) に従う
version = "0.8.0"
description = "Inquira — 社内ヘルプデスク用 RAG プラットフォーム"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pypdf>=5.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]
embedding = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# 適用するルールを明示的に固定する。
# 未指定だと ruff の「既定ルールセット」がそのまま使われるため、ruff 本体が
# バージョンアップで既定を広げた際に、コードを一切変更していなくても CI が
# 赤くなる (実際に ruff 0.16.0 で既定が拡張され、155 件の指摘が発生した)。
# 下記は従来の既定と同等: E4/E7/E9 (pycodestyle の主要エラー) + F (Pyflakes)。
# ルールを増やす場合は、対象の指摘を解消してから select に追記すること。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

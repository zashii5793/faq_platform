[project]
name = "faq-platform"
# バージョンは app/__init__.py の __version__ と同期させること
# Semantic Versioning (https://semver.org/lang/ja/) に従う
version = "0.8.0"
description = "Inquira — 社内ヘルプデスク用 RAG プラットフォーム"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pypdf>=5.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]
embedding = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
